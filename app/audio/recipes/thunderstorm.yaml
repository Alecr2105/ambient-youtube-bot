slug: thunderstorm
name: Thunderstorm and Rain
subniches: [sleep, relaxation]
keywords: [thunderstorm sounds, thunder and rain, rain and thunder sounds for sleeping, heavy rain sounds, tropical storm]
visual_tags: [rain, storm, clouds, jungle, forest]
costa_rica_eligible: true
layers:
- name: rain
  library: {category: heavy_rain_texture, query: heavy rain, min_duration_s: 60, max_duration_s: 300, count: 4, pool_size: 12}
  granular: {grain_min_s: 8, grain_max_s: 30, crossfade_s: 5, pitch_cents: 25, reverse_probability: 0.15, gain_jitter_db: 0.75}
  gain_db: [-1, 0]
  automation: {depth_db: 1.0, min_period_s: 40, max_period_s: 200}
  intensity_depth_db: 1.0
  eq: {highpass_hz: 50}
- name: storm
  library: {category: thunderstorm_texture, query: thunderstorm, min_duration_s: 60, max_duration_s: 300, count: 3, pool_size: 10}
  granular: {grain_min_s: 8, grain_max_s: 30, crossfade_s: 5, pitch_cents: 25, reverse_probability: 0.15, gain_jitter_db: 0.75}
  gain_db: [-6, -3]
  automation: {depth_db: 1.0, min_period_s: 40, max_period_s: 200}
  intensity_depth_db: 1.0
  eq: {highpass_hz: 35}
events:
- name: thunder
  library: {category: thunder_events, query: thunder, min_duration_s: 2, max_duration_s: 20, count: 10, pool_size: 24}
  pitch_cents: 40
  required: true
  rate_per_hour: [8, 18]
  gain_db: [-10, -3]
  min_gap_s: 40
  intensity_rate_scale: 0.5
intensity: {min_period_s: 600, max_period_s: 1800}

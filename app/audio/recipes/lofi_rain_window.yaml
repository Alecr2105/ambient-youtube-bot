slug: lofi_rain_window
name: Lofi Rain
subniches: [study, relaxation]
keywords: [lofi rain, lofi music for study, rainy lofi, chill lofi beats, lofi guitar]
visual_tags: [rain, window]
costa_rica_eligible: true
# Generated lofi music over the rain-on-window ambience of rain_window_real, kept 15 LU below.
music: {bed_below_lu: 15}
layers:
- name: window
  library: {category: rain_window_texture, query: rain window, min_duration_s: 60, max_duration_s: 300, count: 4, pool_size: 12}
  granular: {grain_min_s: 8, grain_max_s: 30, crossfade_s: 5, pitch_cents: 25, reverse_probability: 0.15, gain_jitter_db: 0.75}
  gain_db: [-1, 0]
  automation: {depth_db: 1.0, min_period_s: 40, max_period_s: 200}
  intensity_depth_db: 1.0
  eq: {highpass_hz: 50}
- name: distant_rain
  library: {category: light_rain_texture, query: light rain, min_duration_s: 60, max_duration_s: 300, count: 3, pool_size: 10}
  granular: {grain_min_s: 8, grain_max_s: 30, crossfade_s: 5, pitch_cents: 25, reverse_probability: 0.15, gain_jitter_db: 0.75}
  gain_db: [-9, -6]
  automation: {depth_db: 1.0, min_period_s: 40, max_period_s: 200}
  intensity_depth_db: 1.0
  eq: {highpass_hz: 40, lowpass_hz: 5000}

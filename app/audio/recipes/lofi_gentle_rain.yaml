slug: lofi_gentle_rain
name: Rainy Day Lofi
subniches: [study, relaxation]
keywords: [rainy day lofi, lofi rain, lofi music for studying, chill beats to study, relaxing lofi]
visual_tags: [rain, leaves, forest, jungle]
costa_rica_eligible: true
# Generated lofi music over the gentle_rain ambience, kept 15 LU below.
music: {bed_below_lu: 15}
layers:
- name: rain
  library: {category: light_rain_texture, query: light rain, min_duration_s: 60, max_duration_s: 300, count: 4, pool_size: 12}
  granular: {grain_min_s: 8, grain_max_s: 30, crossfade_s: 5, pitch_cents: 25, reverse_probability: 0.15, gain_jitter_db: 0.75}
  gain_db: [-1, 0]
  automation: {depth_db: 1.0, min_period_s: 40, max_period_s: 200}
  intensity_depth_db: 1.0
  eq: {highpass_hz: 80}
- name: rain_on_leaves
  library: {category: rain_leaves_texture, query: rain leaves, min_duration_s: 60, max_duration_s: 300, count: 3, pool_size: 8}
  granular: {grain_min_s: 8, grain_max_s: 30, crossfade_s: 5, pitch_cents: 25, reverse_probability: 0.15, gain_jitter_db: 0.75}
  gain_db: [-7, -4]
  automation: {depth_db: 1.0, min_period_s: 40, max_period_s: 200}
  intensity_depth_db: 1.0
  eq: {highpass_hz: 80}
intensity: {min_period_s: 900, max_period_s: 2400}

slug: wind
name: Soft Wind
subniches: [sleep, relaxation]
keywords: [wind sounds, wind sounds for sleeping, howling wind, relaxing wind, ambient nature]
visual_tags: [wind, mountains, clouds, forest]
costa_rica_eligible: true
layers:
  - name: wind
    generator: wind
    params: {gustiness: [0.4, 0.7], whistle_level: [0.03, 0.12], min_gust_s: [4, 8], max_gust_s: [18, 35]}
    automation: {depth_db: 2.0, min_period_s: 30, max_period_s: 150}
    intensity_depth_db: 3.0
    eq: {highpass_hz: 50}
  - name: low_air
    generator: brown_noise
    gain_db: [-18, -14]
    automation: {depth_db: 2.0, min_period_s: 60, max_period_s: 240}
    eq: {lowpass_hz: 400}

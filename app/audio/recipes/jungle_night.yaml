slug: jungle_night
name: Rainforest Night with Frogs and Insects
subniches: [sleep, relaxation]
keywords: [jungle sounds, rainforest sounds at night, night ambience, frogs and crickets, nature sounds for sleeping, costa
    rica]
visual_tags: [night, jungle, rainforest]
costa_rica_eligible: true
layers:
- name: chorus
  library: {category: jungle_night_texture, query: rainforest night, min_duration_s: 60, max_duration_s: 300, count: 4, pool_size: 10}
  granular: {grain_min_s: 8, grain_max_s: 30, crossfade_s: 5, pitch_cents: 25, reverse_probability: 0.15, gain_jitter_db: 0.75}
  gain_db: [-1, 0]
  automation: {depth_db: 1.0, min_period_s: 40, max_period_s: 200}
  intensity_depth_db: 1.0
  eq: {highpass_hz: 40}
- name: frogs
  library: {category: frogs_night_texture, query: frogs night, min_duration_s: 60, max_duration_s: 300, count: 3, pool_size: 8}
  granular: {grain_min_s: 8, grain_max_s: 30, crossfade_s: 5, pitch_cents: 25, reverse_probability: 0.15, gain_jitter_db: 0.75}
  gain_db: [-7, -4]
  automation: {depth_db: 1.0, min_period_s: 40, max_period_s: 200}
  intensity_depth_db: 1.0
  eq: {highpass_hz: 40}
